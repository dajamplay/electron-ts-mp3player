<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/player.css">
</head>
<body>
<div class="wrapper">
    <div class="title_bar_wrapper">
        <div class="title">Maksim Aksenov Player 2022</div>
        <div id="btn_min" class="btn_window_control">_</div>
        <div id="btn_close" class="btn_window_control">x</div>
    </div>
    <div class="player">
        <audio class="audio"></audio>

        <div class="control_buttons_wrapper">
            <button class="btn_control btn_menu">Menu</button>
            <button class="btn_control btn_player">Player</button>
            <button class="btn_control btn_playlist">Playlist</button>
            <button class="btn_control btn_close">Close</button>
            <button class="btn_control btn_hide">Hide</button>
        </div>

        <div class="name_wrapper">
            <div class="name">Song name</div>
        </div>

        <div class="info_wrapper">
            <div class="time_wrapper">
                <div class="time">
                    <span class="time_current">00:00:00</span><span class="time_separator"> - </span><span class="time_end">00:00:00</span>
                </div>
            </div>
            <div class="volume_wrapper">
                <div class="volume">
                    <input id="volume_input" type="range" min="0" max="1" step="0.01">
                </div>
            </div>
            <div class="volume_percent_wrapper">
                <div class="volume_percent"></div>
            </div>
        </div>

        <div class="progress_wrapper">
            <div class="progress_container">
                <div class="progress_bar"></div>
            </div>
        </div>

        <div class="buttons_wrapper">
            <button class="btn prev">
                <div class="prev1 prev_common"></div>
                <div class="prev2 prev_common"></div>
                <div class="prev3 prev_common"></div>
                <div class="prev4 prev_common"></div>
            </button>
            <button class="btn play rotate-shadows"></button>
            <button class="btn stop"></button>
            <button class="btn next">
                <div class="next1 next_common"></div>
                <div class="next2 next_common"></div>
                <div class="next3 next_common"></div>
                <div class="next4 next_common"></div>
            </button>
        </div>

    </div>
    <div class="playlist">

    </div>
    <div class="footer_wrapper">
        <div class="footer">Maksim Aksenov 2022</div>
    </div>
    <script>
        require("./../renderers/player/playerRenderer.js");
    </script>
</div>
</body>
</html>
